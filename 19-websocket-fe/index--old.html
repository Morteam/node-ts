<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>WS Status: <span></span></h1>
  <form>
    <input type="text" placeholder="Send message">
    <button>Send</button>
  </form>
  <ul id="messages"></ul>

  <script>
    const formEl = document.querySelector('form')
    const inputEl = document.querySelector('input[type="text"]')
    const buttonEl = document.querySelector('button')
    const listEl = document.querySelector('ul')
    const statusEl = document.querySelector('h1 span')

    function connectToWSServer() {
      const socket = new WebSocket('ws://localhost:3000')
  
      const sendMessage = message => {
        if(message.length < 0) return;
        
        socket.send(message)
      }
  
      const renderListItem = (message) => {
        const liEl = document.createElement('li')
        liEl.innerHTML = message
  
        listEl.prepend(liEl)
      }
  
      socket.onopen = (event) => {
        statusEl.innerHTML = 'FE: Connected'
      }
      
      socket.onclose = (event) => {
        statusEl.innerHTML = 'FE: Disconnected'

        setTimeout(() => { // Clear timeout
          connectToWSServer()
        }, 2000) // Polling
      }
  
      socket.onmessage = (ev) => {
        const payload = JSON.parse(ev.data)
  
        renderListItem(payload.data)
      }
  
      formEl.addEventListener('submit', e => {
        e.preventDefault()
        const message = inputEl.value
        sendMessage(message)
        inputEl.value = ''
      })
    }

    connectToWSServer()

  </script>

  <p>For run correctly execute: npx http-server -o</p>
</body>
</html>
